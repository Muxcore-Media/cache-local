name: Release
on:
  push:
    tags: ["v*"]

jobs:
  goreleaser:
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
          repository: Muxcore-Media/core
      - uses: actions/checkout@v4
        with:
          path: cache-local
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Build binaries
        working-directory: ./cache-local
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/cache-local-linux-amd64 ./cmd/module
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/cache-local-linux-arm64 ./cmd/module
      - uses: docker/setup-buildx-action@v4
      - name: Lowercase image name
        run: |
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./cache-local/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/cache-local:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_OWNER }}/cache-local:latest
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: cache-local/dist/*
          generate_release_notes: true
